<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANCHAR - Personal Chat</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 450px; height: 100vh; background: #1e293b; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Auth Modal */
        #auth-modal { position: absolute; inset: 0; background: #0f172a; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 340px; border: 1px solid #334155; }
        .auth-box h2 { margin-top: 0; color: #818cf8; text-align: center; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .auth-box button { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .toggle-btn { color: #818cf8; cursor: pointer; text-align: center; font-size: 0.85rem; margin-top: 15px; }

        /* App UI */
        .header { background: #0f172a; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .header h3 { margin: 0; color: #818cf8; }
        .user-meta { text-align: right; font-size: 0.75rem; color: #94a3b8; }
        .logout-link { color: #ef4444; cursor: pointer; margin-left: 5px; font-weight: bold; }

        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .screen.active { display: flex; }

        .user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .user-card { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #334155; border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #6366f1; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .chat-target { background: #334155; padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; word-wrap: break-word; }
        .msg.sent { background: #6366f1; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.received { background: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.65rem; opacity: 0.7; text-align: right; margin-top: 4px; display: block; }

        .inputs { padding: 12px; background: #0f172a; display: flex; gap: 8px; }
        .inputs input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #334155; color: white; outline: none; }
        .inputs button { background: #6366f1; border: none; color: white; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        .footer-tag { text-align: center; padding: 8px; font-size: 0.75rem; color: #64748b; border-top: 1px solid #334155; background: #0f172a; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Auth Screen -->
    <div id="auth-modal">
        <div class="auth-box">
            <h2 id="auth-title">लॉगिन करें</h2>
            <div id="signup-fields" style="display: none;">
                <input type="text" id="reg-contact" placeholder="मोबाइल नंबर या ईमेल दर्ज करें">
            </div>
            <input type="text" id="auth-username" placeholder="Username">
            <input type="password" id="auth-password" placeholder="Password">
            <button id="auth-submit-btn" onclick="handleAuth()">लॉगिन</button>
            <div class="toggle-btn" id="auth-toggle" onclick="toggleAuthMode()">नया अकाउंट बनाएँ (Sign Up)</div>
        </div>
    </div>

    <!-- Main App Header -->
    <div class="header">
        <h3>SANCHAR</h3>
        <div class="user-meta">
            <div><strong id="my-username">User</strong> (<span id="my-uid" style="color:#818cf8;">UID</span>)</div>
            <span class="logout-link" onclick="logout()">Logout</span>
        </div>
    </div>

    <!-- User List Screen -->
    <div id="users-screen" class="screen active">
        <div style="padding: 10px; font-size: 0.85rem; color: #94a3b8;">ऑनलाइन यूज़र्स:</div>
        <div class="user-list" id="users-container"></div>
        <div class="footer-tag">Designed and developed by <b style="color: #818cf8;">Manohar Bishnoi</b></div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen">
        <div class="chat-target">
            <button class="back-btn" onclick="showUsersList()">←</button>
            <div class="avatar" id="target-avatar">?</div>
            <strong id="target-name">User</strong>
        </div>
        <div class="messages" id="msgs"></div>
        <div class="inputs">
            <input type="text" id="message-input" placeholder="मैसेज लिखें..." onkeypress="handleKey(event)">
            <button onclick="sendPrivateMsg()">भेजें</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let isSignUpMode = false;
    let currentUser = null;
    let currentTarget = '';

    // Check if already logged in (Persistent Session)
    window.onload = function() {
        const savedUser = localStorage.getItem('sanchar_user');
        if(savedUser) {
            currentUser = JSON.parse(savedUser);
            initApp();
        }
    };

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('auth-title').innerText = isSignUpMode ? 'साइन अप करें' : 'लॉगिन करें';
        document.getElementById('signup-fields').style.display = isSignUpMode ? 'block' : 'none';
        document.getElementById('auth-submit-btn').innerText = isSignUpMode ? 'साइन अप करें' : 'लॉगिन';
        document.getElementById('auth-toggle').innerText = isSignUpMode ? 'पहले से अकाउंट है? लॉगिन करें' : 'नया अकाउंट बनाएँ (Sign Up)';
    }

    async function handleAuth() {
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        
        if(isSignUpMode) {
            const contact = document.getElementById('reg-contact').value.trim();
            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, contact, password })
            });
            const data = await res.json();
            if(data.success) {
                alert(`अकाउंट बन गया! आपकी UID है: ${data.uid}`);
                currentUser = { username: data.username, uid: data.uid };
                localStorage.setItem('sanchar_user', JSON.stringify(currentUser));
                initApp();
            } else {
                alert(data.message);
            }
        } else {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if(data.success) {
                currentUser = { username: data.username, uid: data.uid };
                localStorage.setItem('sanchar_user', JSON.stringify(currentUser));
                initApp();
            } else {
                alert(data.message);
            }
        }
    }

    function initApp() {
        document.getElementById('auth-modal').style.display = 'none';
        document.getElementById('my-username').innerText = currentUser.username;
        document.getElementById('my-uid').innerText = currentUser.uid;
        socket.emit('register_user', currentUser.username);
    }

    function logout() {
        localStorage.removeItem('sanchar_user');
        location.reload();
    }

    socket.on('update_user_list', function(userList) {
        if(!currentUser) return;
        const container = document.getElementById('users-container');
        container.innerHTML = '';
        
        userList.forEach(user => {
            if (user !== currentUser.username) {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.onclick = () => openChatWith(user);
                card.innerHTML = `
                    <div class="user-info">
                        <div class="avatar">${user.charAt(0).toUpperCase()}</div>
                        <strong>${user}</strong>
                    </div>
                    <span style="color: #22c55e; font-size: 0.75rem;">🟢 Online</span>
                `;
                container.appendChild(card);
            }
        });
        if (container.innerHTML === '') {
            container.innerHTML = '<div style="text-align: center; color: #64748b; margin-top: 20px;">कोई ऑनलाइन नहीं है</div>';
        }
    });

    async function openChatWith(user) {
        currentTarget = user;
        document.getElementById('target-name').innerText = user;
        document.getElementById('target-avatar').innerText = user.charAt(0).toUpperCase();
        
        document.getElementById('users-screen').classList.remove('active');
        document.getElementById('chat-screen').classList.add('active');

        // Load chat history from DB
        const res = await fetch(`/api/messages/${currentUser.username}/${user}`);
        const data = await res.json();
        if(data.success) {
            renderMessages(data.messages);
        }
    }

    function showUsersList() {
        currentTarget = '';
        document.getElementById('chat-screen').classList.remove('active');
        document.getElementById('users-screen').classList.add('active');
    }

    function sendPrivateMsg() {
        const input = document.getElementById('message-input');
        const msg = input.value.trim();
        if (msg && currentTarget) {
            socket.emit('private_message', { sender: currentUser.username, recipient: currentTarget, message: msg });
            input.value = '';
        }
    }

    socket.on('receive_private_message', function(data) {
        if ((data.sender === currentUser.username && data.recipient === currentTarget) ||
            (data.sender === currentTarget && data.recipient === currentUser.username)) {
            appendSingleMessage(data);
        }
    });

    function renderMessages(messages) {
        const msgsContainer = document.getElementById('msgs');
        msgsContainer.innerHTML = '';
        messages.forEach(data => appendSingleMessage(data));
    }

    function appendSingleMessage(data) {
        const msgsContainer = document.getElementById('msgs');
        const isSelf = data.sender === currentUser.username;
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${isSelf ? 'sent' : 'received'}`;
        msgDiv.innerHTML = `
            <div>${data.message}</div>
            <span class="msg-time">${data.time}</span>
        `;
        msgsContainer.appendChild(msgDiv);
        msgsContainer.scrollTop = msgsContainer.scrollHeight;
    }

    function handleKey(e) {
        if(e.key === 'Enter') sendPrivateMsg();
    }
</script>
</body>
</html>
