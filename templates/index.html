<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANCHAR - Personal Chat</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .app-container { width: 100%; max-width: 450px; height: 100vh; background: #1e293b; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Modal for Name Entry */
        #login-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .login-box { background: #334155; padding: 25px; border-radius: 12px; width: 100%; max-width: 320px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; background: #1e293b; color: white; outline: none; }
        .login-box button { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* App Layout */
        .header { background: #0f172a; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .header h3 { margin: 0; color: #818cf8; }
        
        /* Views */
        .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .screen.active { display: flex; }

        /* User List View */
        .user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .user-card { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: #334155; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .user-card:hover { background: #475569; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #6366f1; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* Chat View */
        .chat-target { background: #334155; padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .msg.sent { background: #6366f1; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.received { background: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.65rem; opacity: 0.7; text-align: right; margin-top: 4px; display: block; }

        .inputs { padding: 12px; background: #0f172a; display: flex; gap: 8px; }
        .inputs input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #334155; color: white; outline: none; }
        .inputs button { background: #6366f1; border: none; color: white; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- Login Modal -->
<div id="login-modal">
    <div class="login-box">
        <h3>SANCHAR में आपका स्वागत है</h3>
        <input type="text" id="my-name-input" placeholder="अपना नाम दर्ज करें...">
        <button onclick="login()">शुरू करें</button>
    </div>
</div>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <h3>SANCHAR</h3>
        <span id="my-name-display" style="font-size: 0.85rem; color: #94a3b8;"></span>
    </div>

    <!-- 1. USER LIST SCREEN -->
    <div id="users-screen" class="screen active">
        <div style="padding: 10px; font-size: 0.85rem; color: #94a3b8;">ऑनलाइन यूज़र्स (चैट करने के लिए क्लिक करें):</div>
        <div class="user-list" id="users-container"></div>
    </div>

    <!-- 2. PERSONAL CHAT SCREEN -->
    <div id="chat-screen" class="screen">
        <div class="chat-target">
            <button class="back-btn" onclick="showUsersList()">←</button>
            <div class="avatar" id="target-avatar">?</div>
            <strong id="target-name">User</strong>
        </div>
        <div class="messages" id="msgs"></div>
        <div class="inputs">
            <input type="text" id="message-input" placeholder="मैसेज लिखें..." onkeypress="handleKey(event)">
            <button onclick="sendPrivateMsg()">भेजें</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let myName = '';
    let currentTarget = '';
    let chatStore = {}; // { username: [messages] }

    function login() {
        const input = document.getElementById('my-name-input').value.trim();
        if(input) {
            myName = input;
            document.getElementById('my-name-display').innerText = `👤 ${myName}`;
            document.getElementById('login-modal').style.display = 'none';
            socket.emit('register_user', myName);
        }
    }

    socket.on('update_user_list', function(userList) {
        const container = document.getElementById('users-container');
        container.innerHTML = '';
        
        userList.forEach(user => {
            if (user !== myName) {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.onclick = () => openChatWith(user);
                card.innerHTML = `
                    <div class="user-info">
                        <div class="avatar">${user.charAt(0).toUpperCase()}</div>
                        <strong>${user}</strong>
                    </div>
                    <span style="color: #22c55e; font-size: 0.75rem;">🟢 Online</span>
                `;
                container.appendChild(card);
            }
        });
        if (container.innerHTML === '') {
            container.innerHTML = '<div style="text-align: center; color: #64748b; margin-top: 20px;">कोई ऑनलाइन नहीं है</div>';
        }
    });

    function openChatWith(user) {
        currentTarget = user;
        document.getElementById('target-name').innerText = user;
        document.getElementById('target-avatar').innerText = user.charAt(0).toUpperCase();
        
        document.getElementById('users-screen').classList.remove('active');
        document.getElementById('chat-screen').classList.add('active');
        
        renderMessages();
    }

    function showUsersList() {
        currentTarget = '';
        document.getElementById('chat-screen').classList.remove('active');
        document.getElementById('users-screen').classList.add('active');
    }

    function sendPrivateMsg() {
        const input = document.getElementById('message-input');
        const msg = input.value.trim();
        if (msg && currentTarget) {
            socket.emit('private_message', { recipient: currentTarget, message: msg });
            input.value = '';
        }
    }

    socket.on('receive_private_message', function(data) {
        const otherUser = (data.sender === myName) ? data.recipient : data.sender;
        
        if (!chatStore[otherUser]) {
            chatStore[otherUser] = [];
        }
        chatStore[otherUser].push(data);

        if (currentTarget === otherUser) {
            renderMessages();
        }
    });

    function renderMessages() {
        const msgsContainer = document.getElementById('msgs');
        msgsContainer.innerHTML = '';
        
        const history = chatStore[currentTarget] || [];
        history.forEach(data => {
            const isSelf = data.sender === myName;
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isSelf ? 'sent' : 'received'}`;
            msgDiv.innerHTML = `
                <div>${data.message}</div>
                <span class="msg-time">${data.time}</span>
            `;
            msgsContainer.appendChild(msgDiv);
        });
        msgsContainer.scrollTop = msgsContainer.scrollHeight;
    }

    function handleKey(e) {
        if(e.key === 'Enter') sendPrivateMsg();
    }
</script>
</body>
</html>
